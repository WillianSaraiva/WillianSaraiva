<svg width="1000" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg{fill:#fff;stroke:#d0d7de}.t{fill:#1f2328;font:700 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.p{fill:#57606a;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.q{fill:#57606a;font:italic 17px Georgia,serif}
