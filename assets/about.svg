<rect class="bg" x="1" y="1" width="998" height="218" rx="16"/>
<text x="34" y="45" class="t">👨‍💻  Sobre mim</text>
<text x="34" y="82" class="p">Sou estudante de Análise e Desenvolvimento de Sistemas (ADS) e estou construindo minha base</text>
<text x="34" y="108" class="p">na área de desenvolvimento de software. Estudo lógica, Python, C, estruturas de dados, Git</text>
<text x="34" y="134" class="p">e GitHub, usando este perfil para registrar minha evolução, organizar projetos e praticar.</text>
<text x="34" y="172" class="p">Objetivo: evoluir tecnicamente e construir uma base sólida para atuar profissionalmente em tecnologia.</text>
<line x1="790" y1="45" x2="790" y2="180" stroke="#d0d7de"/>
<text x="820" y="77" class="q">“Grandes resultados</text>
<text x="820" y="104" class="q">são construídos com</text>
